notes: >-
  b.well ships four Health SDKs (Web/TypeScript, Android/Kotlin, iOS/Swift, and an
  AI SDK that is an MCP server rather than a package). Only the TypeScript SDK is
  published to a public package registry; the Kotlin and Swift SDKs are distributed
  under a license granted by b.well, so no public Maven Central or CocoaPods
  coordinate exists (a Maven Central search for `bwell` and `com.icanbwell` returns
  zero artifacts). The Python packages below are b.well's open-source FHIR data
  engineering libraries, published from the icanbwell GitHub organization.
