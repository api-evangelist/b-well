description: >-
  b.well publishes no rate limits, quotas or throttling policy. The complete
  documentation index at https://developer.bwell.com/llms.txt (64,423 bytes, HTTP 200,
  fetched 2026-08-15) contains zero occurrences of "rate limit", "ratelimit",
  "throttle" or "quota", and no rate-limit page exists at
  https://developer.bwell.com/docs/rate-limits. No limits could be observed at
  runtime either: every b.well API host rejects anonymous requests before routing —
  api.client-sandbox.icanbwell.com returns 401 Unauthorized,
  user-data-ops.client-sandbox.icanbwell.com returns 403 Missing Authentication
  Token, and fhir.icanbwell.com/4_0_0/metadata returns 401 with a FHIR
  OperationOutcome — so no X-RateLimit-*/RateLimit-*/Retry-After header could be
  captured on an unauthenticated response.
limit_count: 0
headers: null
responseCodes: {}
limits: []
policies: []
notes: >-
  Honest zero, not an unchecked field. Limits may exist and be communicated
  contractually during onboarding, but nothing is published, so an integrator cannot
  size a workload and an agent cannot read a runtime backoff signal. Fixable by
  b.well: publish the per-key/per-tenant limits and emit RateLimit-* plus Retry-After
  on 429. Cross-referenced from conventions/b-well-conventions.yml (rate_limiting).
fixable_by: b.well
