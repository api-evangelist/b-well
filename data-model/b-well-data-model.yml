method: derived
source: openapi/*.json + https://developer.bwell.com/reference/ts-sdk-apireference
notes: >-
  The two published OpenAPI documents describe only three operations and carry almost
  no schema surface, so the entity graph below is derived from b.well's published SDK
  API Reference (the object/enum/input catalogue indexed in llms.txt) rather than from
  the specs. Every entity named here appears as a documented reference page. b.well's
  core is FHIR R4, so most entities are FHIR resources rather than proprietary objects;
  the b.well-specific spine is Person -> Connection -> DataSource, with Consent
  gating what flows through it.
root_entity:
  name: Person
  detail: >-
    b.well's identity anchor is the FHIR Person record. Nearly every SDK and MCP call
    resolves a person_id, either passed explicitly or extracted from the
    `clientFhirPersonId` claim on the access token. The Client Webhook API identifies
    the client's user by a `urn:client:identifier` identifier on the Person resource.
  reference: https://developer.bwell.com/reference/user
