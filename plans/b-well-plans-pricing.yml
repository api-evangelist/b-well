notes: >-
  plan_count 0 is a measured absence, not an unread field. This is the normal posture
  for a HIPAA-regulated consumer-mediated health data network — every integrator is a
  covered entity or business associate under a signed agreement — but it does mean no
  price, quota or overage is discoverable before a sales conversation.
