description: >-
  b.well publishes no plans, tiers or prices. It sells a licensed enterprise platform
  to health systems, health plans, employers and retail health brands, and its
  developer platform is reached through a partner onboarding conversation rather than
  a self-serve signup. There is no pricing page (https://www.icanbwell.com/pricing/
  returns 404), the developer portal's complete documentation index
  (https://developer.bwell.com/llms.txt) names no pricing, plan, tier or billing page,
  and the portal's own welcome page documents no commercial terms. Production base
  URLs are described in b.well's docs as "provided during onboarding", which is the
  clearest statement of the model: access is contracted, not purchased.
plan_count: 0
