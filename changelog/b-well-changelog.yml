- version: 1.17.0
  component: b.well Kotlin SDK
  url: https://developer.bwell.com/changelog/bwell-sdk-v1170
  breaking: false
  additions:
  - 'getDataSource now returns integrationType — the integration type of the data source'
  - 'getDataSource now returns consentPolicyUrl — URL of the partner''s consent policy'
  - 'getDataSource now returns consentValidityDuration — ISO 8601 duration, e.g. P1Y'
  - 'getDataSource now returns endpointStatus — current status of the data source endpoint'
