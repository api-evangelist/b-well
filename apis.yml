- aid: b-well:fhir-server
  name: b.well FHIR Server
  description: >-
    System-level FHIR R4 API over b.well's normalized clinical data store, built on the open-source Helix
    FHIR Server. Supports standard FHIR REST search, $everything bulk patient retrieval, International
    Patient Summary generation, and paging vs streaming responses. Authenticated with OAuth 2.0 client
    credentials.
  humanURL: https://developer.bwell.com/docs/fhirserver-overview
  baseURL: https://fhir.icanbwell.com
  tags:
  - FHIR
