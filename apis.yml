- aid: b-well:health-sdk-for-ai-mcp
  name: b.well Health SDK for AI (MCP Server)
  description: >-
    A b.well-hosted Model Context Protocol server that exposes a catalog of healthcare agents/tools —
    insurance coverage validation, FHIR record and lab retrieval, patient summaries, provider search,
    appointment scheduling and prescription transfer — to MCP-compatible LLM clients (OpenAI, Anthropic,
    Google). Every call runs in an authorized end-user context.
  humanURL: https://developer.bwell.com/docs/aisdk-overview
  baseURL: https://api.client-sandbox.icanbwell.com/mcp/
