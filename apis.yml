    url: openapi/b-well-user-data-operations-openapi.json
  - type: Overlay
    url: overlays/b-well-user-data-operations-overlay.yaml
  - type: APIReference
    url: https://developer.bwell.com/reference/post_users-id-data-exports
- aid: b-well:client-webhook-api
  name: b.well Client Webhook API
  description: The webhook contract a b.well client implements to receive asynchronous
    operation events from b.well. b.well POSTs signed event payloads to the client-hosted
    endpoint.
  humanURL: https://developer.bwell.com/reference/post_webhook
  baseURL: https://developer.bwell.com/reference/webhook
  tags:
  - Webhooks
  - Events
  properties:
  - type: OpenAPI
    url: openapi/b-well-client-webhook-api-openapi.json
  - type: Overlay
    url: overlays/b-well-client-webhook-api-overlay.yaml
  - type: Webhooks
    url: asyncapi/b-well-webhooks.yml
- aid: b-well:fhir-server
  name: b.well FHIR Server
  description: System-level FHIR R4 API over b.well's normalized clinical data store,
    built on the open-source Helix FHIR Server. Supports standard FHIR REST search,
    $everything bulk patient retrieval, International Patient Summary generation, and
    paging vs streaming responses. Authenticated with OAuth 2.0 client credentials.
  humanURL: https://developer.bwell.com/docs/fhirserver-overview
  baseURL: https://fhir.icanbwell.com
  tags:
  - FHIR
  - Health Records
  - Interoperability
  properties:
  - type: Documentation
    url: https://developer.bwell.com/docs/fhirserver-overview
  - type: SourceCode
    url: https://github.com/icanbwell/fhir-server
  - type: WellKnown
    url: well-known/b-well-smart-configuration.json
- aid: b-well:health-sdk-for-ai-mcp
  name: b.well Health SDK for AI (MCP Server)
  description: A b.well-hosted Model Context Protocol server that exposes a catalog
    of healthcare agents/tools — insurance coverage validation, FHIR record and lab
    retrieval, patient summaries, provider search, appointment scheduling and prescription
    transfer — to MCP-compatible LLM clients (OpenAI, Anthropic, Google). Every call
    runs in an authorized end-user context.
  humanURL: https://developer.bwell.com/docs/aisdk-overview
  baseURL: https://api.client-sandbox.icanbwell.com/mcp/
