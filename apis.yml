aid: b-well
name: b.well
description: 'b.well Connected Health is a Baltimore-based digital health platform
  that unifies a person''s fragmented medical, pharmacy, claims, wearable and lab data
  into a single FHIR-native longitudinal health record, then exposes that record to
  partner applications through a developer platform. The company operates a consumer-mediated
  health data network spanning millions of providers, health plans, HIEs/HINs, TEFCA
  QHINs and CMS-aligned networks, and licenses it to health systems, payers, employers
  and retail health brands who embed it in their own apps. Its developer surface is
  built around four Health SDKs (Web/TypeScript, Android/Kotlin, iOS/Swift and an AI
  SDK that speaks Model Context Protocol), a federated GraphQL gateway, REST endpoints
  for user data operations and webhooks, and a FHIR R4 server (the open-source Helix
  FHIR Server) supporting $everything and International Patient Summary retrieval.
  Authentication is OAuth 2.0 throughout — token exchange with OIDC for end-user context,
  client credentials for system-to-system access, and HMAC-SHA512 request signing on
  the user data operations API.'
