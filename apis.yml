apis:
- aid: b-well:application-apis
  name: b.well Application APIs
  description: Federated GraphQL gateway plus REST endpoints that let end-user applications
    read and write a person's health data, manage data-source connections, handle consent,
    and coordinate care workflows in an end-user OAuth context.
  humanURL: https://developer.bwell.com/docs/app-apis-overview
  baseURL: https://api.client-sandbox.icanbwell.com/v1
  tags:
  - Health Data
  - GraphQL
  - FHIR
  properties:
  - type: Documentation
    url: https://developer.bwell.com/docs/app-apis-overview
  - type: GraphQL
    url: https://api.client-sandbox.icanbwell.com/v1/graphql
  - type: Console
    url: https://icanbwell.github.io/graphql-doc-site/
  - type: Authentication
    url: https://developer.bwell.com/docs/end-user-auth
- aid: b-well:user-data-operations
  name: b.well User Data Operations API
  description: REST API for user-initiated personal data rights requests — initiating
    a health data export for a user and initiating deletion of a user's profile and
    associated information. Requests are signed with HMAC-SHA512 over a canonical set
    of b.well headers.
  humanURL: https://developer.bwell.com/reference/post_users-id-data-exports
  baseURL: https://user-data-ops.prod.icanbwell.com
  tags:
  - Health Data
  - Privacy
  properties:
