method: derived
source: mcp/b-well-mcp.yml + openapi/*.json + developer.bwell.com docs
summary: >-
  b.well's three machine surfaces barely overlap. The MCP server carries 31 healthcare
  agents; the two public OpenAPI documents carry three operations between them, and
  neither covers a single MCP capability. Everything the MCP server does is backed by
  the federated GraphQL gateway and the FHIR R4 server, not by the published REST specs.
  This is a real surface divergence, not a documentation gap — recorded here rather
  than papered over. Confidence on every row is therefore low-to-medium: the live MCP
  tools/list is auth-gated (401) and GraphQL introspection is not anonymously
  available, so bindings are mapped by the semantics b.well documents, not by matching
  a schema on both ends.
surfaces:
  openapi:
  - file: openapi/b-well-user-data-operations-openapi.json
    title: bwell User Data Operations
    version: 1.0.11
    operations: 2
    gated: false
  - file: openapi/b-well-client-webhook-api-openapi.json
    title: Client Webhook API
    version: 1.0.0
    operations: 1
    gated: false
    note: client-implemented callback contract, not a b.well-hosted endpoint
  graphql:
    endpoint: https://api.client-sandbox.icanbwell.com/v1/graphql
    introspection: gated
    introspection_status: 500
    note: >-
      POST of the standard introspection query returns HTTP 500
      {"errors":[{"message":"internal server error"}]} without a bearer token. b.well
      publishes a rendered schema explorer at
      https://icanbwell.github.io/graphql-doc-site/ but does not serve an SDL or
      schema.json from it (probed: schema.graphql, schema.json, graphql-schema.json —
      all 404).
  mcp:
    url: https://api.client-sandbox.icanbwell.com/mcp/
    tools_list: gated
    tools_list_status: 401
  fhir:
    endpoint: https://fhir.icanbwell.com
    capability_statement: /4_0_0/metadata
    capability_statement_status: 401
    note: the FHIR CapabilityStatement is the closest thing to a machine contract for
      the health-record tools, and it requires authentication
