standards:
- id: fhir-r4
  conforms: true
  evidence: >-
    b.well operates a FHIR R4 server (the open-source Helix FHIR Server,
    github.com/icanbwell/fhir-server) supporting standard FHIR REST operations, search
    parameters, paging and streaming. The SDK object model is FHIR-shaped throughout
    (Person, Patient, Coverage, Observation, Condition, MedicationRequest, Appointment,
    DocumentReference, ExplanationOfBenefit, CarePlan, CareTeam, Specimen,
    ServiceRequest, VerificationResult).
  docs: https://developer.bwell.com/docs/fhirserver-overview
- id: fhir-everything-operation
  conforms: true
  evidence: '$everything is documented for bulk retrieval of a complete patient record.'
  docs: https://developer.bwell.com/docs/fhirserver-everything
- id: fhir-ips
  conforms: true
  evidence: International Patient Summary generation is a documented FHIR Server capability,
    with a dedicated open-source implementation at github.com/icanbwell/fhir-patient-summary.
  docs: https://developer.bwell.com/docs/fhirserver-ips
- id: fhir-messaging
  conforms: true
  evidence: The Client Webhook API is "heavily based on the FHIR messaging specification"
    and delivers a Bundle of type message with a MessageHeader.
  source: openapi/b-well-client-webhook-api-openapi.json
- id: fhir-operationoutcome
  conforms: true
  evidence: SDK, GraphQL and FHIR errors are returned as FHIR OperationOutcome resources
    with issue severity and issue-type codes.
  docs: https://developer.bwell.com/docs/error-codes
- id: smart-on-fhir
  conforms: partial
  evidence: >-
    Both FHIR hosts serve /.well-known/smart-configuration (HTTP 200) with authorization,
    token, revocation, userinfo and JWKS endpoints. The document advertises only the
    identity scopes (openid, profile, email, phone) — no SMART clinical scopes
    (patient/*.read) and no `capabilities` array, so it is a partial SMART App Launch
    discovery document.
  source: well-known/b-well-smart-configuration.json
- id: oauth2
  conforms: true
  evidence: OAuth 2.0 is used across all APIs; client credentials (RFC 6749 §4.4) for
    system auth and token exchange for end-user auth.
  docs: https://developer.bwell.com/docs/auth-overview
- id: oauth2-token-exchange
  conforms: true
  evidence: End-user authentication exchanges the integrator's OIDC ID token for a
    b.well access token.
  docs: https://developer.bwell.com/docs/oauth-token-exchange
- id: oidc
  conforms: true
  evidence: OpenID Connect ID tokens are the input to token exchange; the SMART
    configuration advertises RS256 ID token signing and a userinfo endpoint.
