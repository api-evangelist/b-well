source: developer.bwell.com docs
notes: >-
  b.well ships prebuilt, embeddable end-user surfaces alongside its SDKs — these are
  UI you drop into your own app, distinct from the server-side and client libraries
  catalogued in packages/.
families:
- name: b.well Embeddable
  description: >-
    Prebuilt b.well experiences embedded directly into a partner's own application,
    so the partner does not have to build the health-record UI themselves.
  docs: https://developer.bwell.com/docs/embeddable-overview
  integrations:
  - platform: web
    docs: https://developer.bwell.com/docs/embeddable-web-integration
  - platform: react-native
    docs: https://developer.bwell.com/docs/embeddable-react-native-integration
- name: bailey (Health AI Assistant)
  description: >-
    A ready-to-deploy Health AI Assistant b.well describes as the first-ever SDK for
    health AI assistants. Offered as an embeddable UI as well as programmatic
    completion APIs.
  docs: https://developer.bwell.com/docs/bailey-sdk
  surfaces:
  - name: bailey Embeddable UI
    docs: https://developer.bwell.com/docs/bailey-embeddable-ui
    type: embedded assistant UI for mobile apps
  - name: bailey Chat Completions API
    docs: https://developer.bwell.com/docs/bailey-chat-completions-api
    type: API
  - name: bailey Responses API
    docs: https://developer.bwell.com/docs/bailey-responses-api
    type: API
- name: FHIR Server Web UI
  description: >-
    A hosted, view-only web interface over the b.well FHIR Server for testing and
    troubleshooting, accessed with a b.well user account. Open source at
    github.com/icanbwell/fhir-server-ui.
  docs: https://developer.bwell.com/docs/fhir-server-web-ui
  source: https://github.com/icanbwell/fhir-server-ui
  type: hosted console
- name: GraphQL Playground
  description: >-
